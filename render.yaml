services:
  - type: web
    name: storepulse-api
    env: node
    region: singapore
    plan: free
    rootDir: apps/api
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: PORT
        value: 10000

  - type: web
    name: storepulse-web
    env: static
    region: singapore
    buildCommand: npm install && npm run build
    staticPublishPath: apps/web/dist
    pullRequestPreviewsEnabled: true
    rootDir: apps/web
    envVars:
      - key: VITE_API_URL
        sync: false
